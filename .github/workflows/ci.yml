name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs-version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['30.1', snapshot]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Install dependencies (transient from GNU ELPA, package-lint)
        run: make deps
      - name: Byte compile
        run: make compile
      - name: Lint
        run: make lint
      - name: Run tests
        run: make test

  # The macOS runner has `say' and `afplay', so tests guarded by
  # `skip-unless' for the say backend and the afplay player run here.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'
      - name: Install dependencies (transient from GNU ELPA)
        run: make deps
      - name: Run tests
        run: make test
